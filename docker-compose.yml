version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pricecompass
      POSTGRES_USER: pricecompass
      POSTGRES_PASSWORD: pricecompass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./services/api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://pricecompass:pricecompass@db:5432/pricecompass
      ER_CONFIDENCE_THRESHOLD: 0.7
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./services/web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_APP_NAME: FiyatPusulası
    ports:
      - "3000:3000"
    command: npm run start

volumes:
  pgdata:
